<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng Nhập - Sân Bóng</title>
  <!-- Nhúng CSS (ví dụ Bootstrap) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; }
    .login-container { max-width: 400px; margin: 100px auto; padding: 30px; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .login-container h2 { text-align: center; margin-bottom: 30px; color: #333; }
  </style>
</head>
<body>
<div class="login-container">
  <h2>Đăng Nhập</h2>

  <!-- Thông báo lỗi từ Spring Security -->
  <div th:if="${param.error}" class="alert alert-danger" role="alert">
    Tên đăng nhập hoặc mật khẩu không đúng.
  </div>
  <!-- Thông báo lỗi chung từ controller (nếu có) -->
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
    <span th:text="${errorMessage}"></span>
  </div>
  <!-- Thông báo logout thành công -->
  <div th:if="${param.logout}" class="alert alert-success" role="alert">
    Bạn đã đăng xuất thành công.
  </div>
  <!-- Thông báo đăng ký thành công -->
  <div th:if="${successMessage}" class="alert alert-success" role="alert">
    <span th:text="${successMessage}"></span>
  </div>

  <form th:action="@{/login}" method="post"> <!-- Action trỏ đến URL xử lý của Spring Security -->
    <div class="mb-3">
      <label for="username" class="form-label">Tên đăng nhập</label>
      <input type="text" class="form-control" id="username" name="username" required autofocus> <!-- name phải là "username" -->
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Mật khẩu</label>
      <input type="password" class="form-control" id="password" name="password" required> <!-- name phải là "password" -->
    </div>
    <!-- Tùy chọn: Remember Me -->
    <!--
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
        <label class="form-check-label" for="remember-me">Ghi nhớ đăng nhập</label>
    </div>
     -->
    <button type="submit" class="btn btn-primary w-100">Đăng Nhập</button>
  </form>
  <div class="mt-3 text-center">
    <a th:href="@{/forgot-password}">Quên mật khẩu?</a> | <a th:href="@{/register}">Đăng ký tài khoản mới</a>
  </div>
</div>

<!-- Nhúng JS (ví dụ Bootstrap) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
