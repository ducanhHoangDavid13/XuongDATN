<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký - Sân Bóng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .register-container { max-width: 550px; margin: 50px auto; padding: 30px; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .register-container h2 { text-align: center; margin-bottom: 30px; color: #333; }
    </style>
</head>
<body>
<div class="register-container">
    <h2>Đăng Ký Tài Khoản Khách Hàng</h2>

    <!-- Thông báo lỗi -->
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi tổng quát</p>
    </div>

    <form th:action="@{/register}" th:object="${account}" method="post">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="username" class="form-label">Tên đăng nhập (*)</label>
                <input type="text" class="form-control" id="username" th:field="*{username}" required maxlength="50"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="col-md-6">
                <label for="hoTen" class="form-label">Họ và Tên</label>
                <input type="text" class="form-control" id="hoTen" th:field="*{hoTen}" maxlength="100">
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="password" class="form-label">Mật khẩu (*)</label>
                <input type="password" class="form-control" id="password" name="password" required
                       th:classappend="${#fields.hasErrors('passwordHash')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('passwordHash')}" th:errors="*{passwordHash}"></div>
            </div>
            <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Nhập lại mật khẩu (*)</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="100"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="col-md-6">
                <label for="soDienThoai" class="form-label">Số Điện Thoại</label>
                <input type="tel" class="form-control" id="soDienThoai" th:field="*{soDienThoai}" maxlength="20"
                       th:classappend="${#fields.hasErrors('soDienThoai')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}"></div>
            </div>
        </div>
        <div class="mb-3">
            <label for="diaChi" class="form-label">Địa Chỉ</label>
            <input type="text" class="form-control" id="diaChi" th:field="*{diaChi}" maxlength="255">
        </div>

        <button type="submit" class="btn btn-primary w-100">Đăng Ký</button>
    </form>
    <div class="mt-3 text-center">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
