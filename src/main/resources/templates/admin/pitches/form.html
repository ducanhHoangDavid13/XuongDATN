<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: adminLayout(~{::title}, ~{::section})}">
<head>
  <title th:text="${pageTitle}">Thêm/Sửa Sân Bóng</title>
</head>
<body>
<section>
  <div class="container-fluid pt-4 px-4">
    <div class="row g-4">
      <div class="col-sm-12 col-xl-10">
        <div class="bg-light rounded h-100 p-4">
          <h6 class="mb-4" th:text="${pageTitle}">Thêm/Sửa Sân Bóng</h6>

          <!-- Thông báo lỗi -->
          <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <i class="fa fa-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
          </div>
          <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi tổng quát</p>
          </div>

          <form th:object="${sanBong}"
                th:action="${isEdit} ? @{/admin/pitches/{id}(id=${sanBong.id})} : @{/admin/pitches}"
                method="post">
            <input type="hidden" th:if="${isEdit}" th:field="*{id}" />

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="tenSan" class="form-label">Tên Sân (*)</label>
                <input type="text" class="form-control" id="tenSan" th:field="*{tenSan}" required maxlength="100"
                       th:classappend="${#fields.hasErrors('tenSan')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('tenSan')}" th:errors="*{tenSan}"></div>
              </div>
              <div class="col-md-6">
                <label for="loaiSan" class="form-label">Loại Sân (*)</label>
                <select class="form-select" id="loaiSan" th:field="*{loaiSan}" required
                        th:classappend="${#fields.hasErrors('loaiSan')} ? 'is-invalid' : ''">
                  <option value="">-- Chọn loại sân --</option>
                  <!-- Giả sử loaiSanList là List<LoaiSan> -->
                  <option th:each="ls : ${loaiSanList}"
                          th:value="${ls.id}"
                          th:text="${ls.tenLoaiSan}"
                          th:selected="${sanBong.loaiSan != null && sanBong.loaiSan.id == ls.id}">
                  </option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('loaiSan')}" th:errors="*{loaiSan}"></div>
              </div>
            </div>

            <div class="mb-3">
              <label for="diaChi" class="form-label">Địa Chỉ</label>
              <input type="text" class="form-control" id="diaChi" th:field="*{diaChi}" maxlength="255">
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="sucChua" class="form-label">Sức Chứa (Người)</label>
                <input type="number" min="1" class="form-control" id="sucChua" th:field="*{sucChua}">
              </div>
              <div class="col-md-6">
                <label for="anhDaiDien" class="form-label">Ảnh Đại Diện (URL)</label>
                <input type="text" class="form-control" id="anhDaiDien" th:field="*{anhDaiDien}" maxlength="255">
              </div>
            </div>


            <div class="mb-3">
              <label for="tienIch" class="form-label">Tiện Ích</label>
              <textarea class="form-control" id="tienIch" rows="3" th:field="*{tienIch}" placeholder="Ví dụ: Đèn chiếu sáng, Wifi, Nước uống, Nhà vệ sinh..."></textarea>
            </div>

            <div class="mb-3">
              <label for="moTa" class="form-label">Mô Tả Chung</label>
              <textarea class="form-control" id="moTa" rows="3" th:field="*{moTa}"></textarea>
            </div>

            <div class="mb-3">
              <label for="trangThai" class="form-label">Trạng Thái (*)</label>
              <select class="form-select" id="trangThai" th:field="*{trangThai}" required
                      th:classappend="${#fields.hasErrors('trangThai')} ? 'is-invalid' : ''">
                <option value="">-- Chọn trạng thái --</option>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
              </select>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('trangThai')}" th:errors="*{trangThai}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
            <a th:href="@{/admin/pitches}" class="btn btn-secondary">Hủy</a>

          </form>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
